<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/Carrito.css">
    <title>Carrito de Compras</title>
</head>
<body>

    <!-- Header Principal -->
    <header class="header">
       
    </header>

    <!-- Carrito principal -->
    <main class = "main">
        <div class="main__producto">
            <h1 class="main__titulo">Tu Carrito De Compra</h1>
        
                <div class="popular__cards" id="mostrarCompra">
        
                    <!-- Card -->
                </div>    
        </div>

        <!-- Apartado de totalizacion -->
        <div class="main__precio">
            <h1 class="precio__titulo">Total De compra</h1>

            <p class="precio__prenda">Total de Compra: </p>
            
            <article class="main__calculo">
                <p class="precio__total" id="precio__total"></p>
            </article>

            <!-- Boton de realizar compra -->
            <button class="header__login btn__inicio" id="RealizarCompra">Realizar Compra</button>

            <!-- Terminos y condiciones -->
            <article class="cont__checkbox">
                <input type="checkbox" name="" class="cont__contenedorcheck" id="cont_terminos">
                <label for="" class="cont__parrafo">Lorem ipsum dolor sit amet consectetur adipisicing elit. Aliquam.</label>
            </article>
        </div>

        <div class="sombreado"></div>

    </main>
    
    <!-- Ventana emergente Carrito de compra -->
    <div id="compraCarrito">
       
    </div>

    <div id="confirmacionPago">
       
    </div>
    <!-- Pie de pagina -->
    <footer class="footer">

    </footer>

    <script src="../js/CarritoCompra.js" type="module"></script>
</body>
</html>
