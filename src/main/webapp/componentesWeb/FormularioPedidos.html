<div class="modal-overlay">
    <div class="modal-container">
        
        <div class="modal-header">
            <button type="button" class="btn-back" id="btn-volver">
                <i class="fa-solid fa-chevron-left"><img src="../images/DetallesProducto/Vector.png" alt=""></i>
            </button>
            <h2>Descripción del pedido:</h2>
        </div>
    
        <form id="form-solicitud-personalizada">
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="tipo-prenda">Tipo de prenda:</label>
                    <input type="text" id="tipo-prenda" class="input-grey">
                </div>
                <div class="form-group">
                    <label for="sugerencia-telas">Sugerencia de telas:</label>
                    <input type="text" id="sugerencia-telas" class="input-grey">
                </div>
            </div>
    
            <div class="inline-row">
                <div class="form-group form-group--row">
                    <label for="talla-prenda">Talla:</label>
                    <input type="text" id="talla-prenda" class="input-grey input-talla">
                </div>
                <div class="form-group form-group--row medidas-inputs">
                    <label>Medidas:</label>
                    <p for="">Cuello:</p>
                    <input type="number" class="input-dark" min="0">
                    <p for="">Pecho:</p>
                    <input type="number" class="input-dark" min="0">
                    <p for="">Largo de Manga:</p>
                    <input type="number" class="input-dark" min="0">
                </div>
            </div>
    
            <div class="form-group">
                <label for="desc-pedido">Descripcion del pedido:</label>
                <textarea id="desc-pedido" class="textarea-full"></textarea>
            </div>
    
            <div class="form-group">
                <label>Algun estampado o imagen que desees agregar a la prenda:</label>
                <div class="upload-zone">
                    <label for="file-upload" class="plus-box">
                        <i class="fa-solid fa-plus"><img src="../images/Pedidos/Vector (1).png" alt=""></i>
                        <input type="file" id="file-upload" accept="image/*" style="display: none;">
                    </label>
                </div>
            </div>
    
            <div class="modal-footer">
                <button type="button" class="btn-footer btn-cancelar" id="btn-Cancelar">Cancelar</button>
                <button type="submit" class="btn-footer btn-confirmar">Realizar Pedido</button>
            </div>
        </form>
    
    </div>
    
</div>
