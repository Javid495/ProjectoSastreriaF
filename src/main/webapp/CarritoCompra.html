<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/Carrito.css">
    <script src="js/CarritoCompra.js" defer></script>
    <title>Carrito</title>
</head>
<body>

    <!-- Header Principal -->
    <header class="header">
       
    </header>

    <!-- Carrito principal -->
    <main class = "main">
        <div class="main__producto">
            <h1 class="main__titulo">Tu Carrito De Compra</h1>
        
                <div class="popular__cards">
        
                    <!-- Card -->
                    <article class="card">
                        <img src="images/Rectangle 11.png" alt="Prenda A" class="card__image">
                        <h3 class="card__title">Prenda A</h3>
                        <p class="card__price">Precio: 40.000</p>
                        <button class="card__button">Ver detalles</button>
                        <button class="button__closed">X</button>
                    </article>
        
                    <article class="card">
                        <img src="images/Rectangle 26.png" alt="Prenda B" class="card__image">
                        <h3 class="card__title">Prenda B</h3>
                        <p class="card__price">Precio: 80.000</p>
                        <button class="card__button">Ver detalles</button>
                        <button class="button__closed">X</button>
                    </article>
        
                    <article class="card">
                        <img src="images/image.png" alt="Prenda C" class="card__image">
                        <h3 class="card__title">Prenda C</h3>
                        <p class="card__price">Precio: 35.000</p>
                        <button class="card__button">Ver detalles</button>
                        <button class="button__closed">X</button>
                    </article>

                    <article class="card">
                        <img src="images/image.png" alt="Prenda C" class="card__image">
                        <h3 class="card__title">Prenda C</h3>
                        <p class="card__price">Precio: 35.000</p>
                        <button class="card__button">Ver detalles</button>
                        <button class="button__closed">X</button>
                    </article>
                </div>
            
        </div>

        <!-- Apartado de totalizacion -->
        <div class="main__precio">
            
            <article class="main__calculo">
                <h1 class="precio__titulo">Total de Compra: </h1>
                <p class="precio__prenda">XX.XXX</p>
                <p class="precio__prenda">XX.XXX</p>
                <p class="precio__prenda">XX.XXX</p>
                <p class="precio__prenda">XX.XXX</p>
                <p class="precio__total"></p>
            </article>

            <!-- Boton de realizar compra -->
            <button class="header__login btn__inicio" id="RealizarCompra">Realizar Compra</button>

            <!-- Terminos y condiciones -->
            <article class="cont__checkbox">
                <input type="checkbox" name="" class="cont__contenedorcheck" id="cont_terminos">
                <label for="" class="cont__parrafo">Lorem ipsum dolor sit amet consectetur adipisicing elit. Aliquam.</label>
            </article>
        </div>

        <div class="sombreado"></div>

        <!-- Ventana emergente Carrito de compra -->
         <div class="compra__carrito">
            <h2 class="compra__titulo">Confirmacion de Pedido</h2>     
            <div class="section__input">

                <form action="" class="carrito__formulario">
                    <label for="" class="carrito__subt">Direccion:</label>
                    <input type="text" class="direccion__input">

                    <label for="" class="carrito__subt">Telefono:</label>
                    <input type="text" class="direccion__input">

                    <label for="" class="carrito__subt">Total:</label>
                    <p class="carrito__subtotal" id="MostrarTotal" >XX.XXX</p>

                    <p class="sub--titulo">Metodos de pago:</p>

                    <div class="metodos__p">

                        <button class="btn__metodop">
                            <img src="images/Nequi.png" alt="" class="metodos__imagen img--nequi">
                        </button>

                        <button class="btn__metodop">
                            <img src="images/Group 6.png" alt="" class="metodos__imagen img--daviplata">
                        </button>
                    </div>

                    <div class="contenedor--botones">
                        <button class="header__login boton--compra" id="cancelarCompra">Cancelar Compra</button>
                        <button class="header__login boton--compra" id="ConfirmarCompra">Confirmar Compra</button>
                    </div>
                </form>
            </div>
         </div>

         <div class="confirmacion__pago">
            <img src="images/ConfirmacionG.png" alt="" class="img__confirmacion">
            <h2 class="confirmacion__text">Tu pedido fue Realizado con exito</h2>

            <button class="header__login btn--confirmar" id="pagoConfirmado">Confirmar</button>
         </div>
    </main>

    <!-- Pie de pagina -->
    <footer class="footer">

    </footer>

    <script src="js/LlamarComp/RelizarPeticion.js" type="module"></script>
</body>
</html>
