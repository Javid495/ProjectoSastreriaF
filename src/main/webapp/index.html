<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/inicio.css">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Inicio
    </title>
</head>
<body>
    <!-- Header principal -->
    <header class="header">
        
    </header>

    <!-- Cuerpo de pagina -->
    <main class="main">

      <div id="btnCompra">

      </div>

      <!-- Barra de búsqueda -->
      <section class="search">
        <div class="search__container">
          <span class="search__brand">
              <span class="icon icon--logo"><img src="images/Logo.png" alt=""></span>
          </span>
          <span class="search__brand">ModaS</span>
          <input type="text" class="search__input" placeholder="Buscar productos...">
          <button class="search__voice"><img class="search__microfono" src="images/Microfono.png" alt=""></button>
        </div>
      </section>

      <!-- Seccion de prendas populares -->
      <section class="popular">
        <div class="popular__category">
          <h2 class="popular__title">Prendas Populares</h2>
          <span class="popular__icon">
            <img src="images/Vector (1).png" alt="">
          </span>
        </div>

        <div class="popular__cards">

          <!-- Card -->
          <button class="button button-left">
              <span class="icon icon--back"><img class="icons" src="images/InicioSecion/Vector.png" alt=""></span>
          </button>

          <article class="card">
            <img src="images/Rectangle 11.png" alt="Prenda A" class="card__image">
            <h3 class="card__title">Prenda A</h3>
            <p class="card__price">Precio: 40.000</p>
            <button class="card__button">Ver detalles</button>
          </article>

          <article class="card">
            <img src="images/Rectangle 26.png" alt="Prenda B" class="card__image">
            <h3 class="card__title">Prenda B</h3>
            <p class="card__price">Precio: 80.000</p>
            <button class="card__button">Ver detalles</button>
          </article>

          <article class="card">
            <img src="images/image.png" alt="Prenda C" class="card__image">
            <h3 class="card__title">Prenda C</h3>
            <p class="card__price">Precio: 35.000</p>
            <button class="card__button">Ver detalles</button>
          </article>
        </div>

        <button class="button button-rigth">
            <span class="icon icon--back"><img class="icons" src="images/Vector (1).png" alt=""></span>
        </button>
        
      </section>

      <!-- Seccion de nuestros porductos -->
      <section class="products">
        <h2 class="products__title">Nuestros productos</h2>

        <div class="products__grid">
          <img src="images/Rectangle 35.png" alt="">
          <img src="images/Rectangle 36.png" alt="">
          <img src="images/Rectangle 37.png" alt="">
          <img src="images/Rectangle 38.png" alt="">
          <img src="images/Rectangle 39.png" alt="">
          <img src="images/Rectangle 40.png" alt="">
        </div>
      </section>
    </main>

    <!-- Footer principal de la pagina -->
    <footer class="footer">
        
    </footer>

    <script src="./js/Inicio.js" type="module" ></script>
</body>
</html>
