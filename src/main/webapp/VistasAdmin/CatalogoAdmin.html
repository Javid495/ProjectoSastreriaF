<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/AdminCatalogo.css">
    <title>Document</title>
</head>
<body>
    <div class="admin-container">

        
        <aside class="sidebar">
            
        </aside>

        <main class="main-content" id="modulo-catalogo">


            <section class="search">
              <div class="search__container">
                <input type="text" class="search__input" placeholder="Buscar productos...">
                <button class="search__voice"><img class="search__microfono" src="../images/Microfono.png" alt=""></button>
              </div>
        
              <section class="filtrados">
                    <!-- Filtro de tallas -->
                    <div class="filtrados__filter">
          
                      <!-- Etiqueta del filtro -->
                      <label for="size" class="filter__label">Talla:</label>
          
                      <!-- Selector de talla -->
                      <select id="size" class="filter__select">
                          <option value="">Seleccionar</option>
                          <option value="s">S</option>
                          <option value="m">M</option>
                          <option value="l">L</option>
                          <option value="xl">XL</option>
                      </select>
                    </div>
          
                    <!-- Filtro de tallas -->
                    <div class="filtrados__filter">
          
                      <!-- Etiqueta del filtro -->
                      <label for="size" class="filter__label">Categoria: </label>
          
                      <!-- Selector de talla -->
                      <select id="size" class="filter__select filter--ti">
                          <option value="">Seleccionar</option>
                          <option value="camisas">Camisas</option>
                          <option value="pantalones">Pantalones</option>
                          <option value="buzos">Buzos</option>
                          <option value="pijamas">Pijamas</option>
                      </select>
                    </div>
                </section>
            </section>
    
            <div class="inventario-container">
                <article class="card-inventario">
                    <div class="img-placeholder">
                        <img src="" alt="Prenda">
                    </div>
                        
                    <div class="info-prenda">
                        <p>Preanda B</p>
                        <p>Precio: 80.000</p>
                        <p>Stock : 2</p>
                    </div>
    
                    <div class="acciones-prenda">
                        <button class="btn-blanco">Modificar Detalles</button>
                        <button class="btn-blanco">Eliminar Prenda</button>
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" name="productosSeleccionados" value="001" class="custom-checkbox">
                    </div>
                </article>
            </div>

            <div class="btn--edicion">
                <button class="btn-blanco btn--eliminar" id="Eliminar" >Eliminar Varios</button>
                <button class="btn-blanco btn--agregar" id="AgregarP" >Agregar Prenda</button>
            </div>

        </main>
    </div>

    <script src="../js/CatalogoAdmin.js" type="module"></script>
</body>
</html>
