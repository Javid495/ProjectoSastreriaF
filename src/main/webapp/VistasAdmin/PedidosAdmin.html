<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - Suescun</title>
    <link rel="stylesheet" href="../css/AdminPedidos.css">
</head>
<body>

    <div class="admin-container">
        <!-- Side bar -->
        <aside class="sidebar">
            
        </aside>

        <!-- Contenido principal -->
        <main class="main-content">
            <h1 class="titulo-vista">Pedidos</h1>

            <div class="cotizaciones-bar">
                <span>Ver Pedidos a Cotizar</span>
                <div class="btn-play"></div>
            </div>

            <!-- Filtro por estados -->
            <nav class="pestanas-estados-container">
                <button class="tab-estado" onclick="cambiarFiltroEstado('pendientes', this)">Pendientes</button>
                <button class="tab-estado active" onclick="cambiarFiltroEstado('elaboracion', this)">Elaboracion</button>
                <button class="tab-estado" onclick="cambiarFiltroEstado('entregar', this)">Por Entregar</button>
            </nav>

            <div class="pedidos-board" id="tablero-pedidos">
                
                <article class="card-pedido">
                    <h2 class="pedido-cliente">Cliente@user1</h2>
                    <p class="pedido-meta">Medidas: xx-xx-xx-xx</p>
                    <p class="pedido-meta">Tipo - P : A medida</p>
                    
                    <div class="pedido-estado-container">
                        <label>Estado:</label>
                        <select class="select-estado-pedido">
                            <option value="elaboracion" selected>En elaboracion</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="entregar">Por entregar</option>
                        </select>
                    </div>
                    
                    <button type="button" class="btn-detalles-pedido">Ver Detalles</button>
                </article>

                <article class="card-pedido">
                    <h2 class="pedido-cliente">Cliente@user1</h2>
                    <p class="pedido-meta">Fecha: XX-XXXXXXXXX</p>
                    <p class="pedido-meta">Tipo - P : Compra</p>
                    
                    <div class="pedido-estado-container">
                        <label>Estado:</label>
                        <select class="select-estado-pedido">
                            <option value="elaboracion" selected>En elaboracion</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="entregar">Por entregar</option>
                        </select>
                    </div>
                    
                    <button type="button" class="btn-detalles-pedido">Ver Detalles</button>
                </article>

            </div>
        </main>
    </div>

    <script type="module" src="../js/PedidosAdmin.js"></script>
</body>
</html>
