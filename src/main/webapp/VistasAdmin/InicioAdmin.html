<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/InicioVistaAdmin.css">
    <title>Document</title>
</head>
<body>
<div class="admin-container">
        <aside class="sidebar">
            
        </aside>

        <main class="main-content">
            <h1 class="titulo-seccion">Inicio</h1>

            <div class="resumen-container">
                <div class="card-resumen">
                    <h3>Nuevos Pedidos:</h3>
                    <div class="numero-contador" id="num-nuevos-pedidos">0</div> 
                </div>
    
                <div class="card-resumen card-resumen--interactiva">
                    <h3>Pedidos a Cotizar:</h3>
                    <div class="numero-contador" id="num-pedidos-cotizar">0</div>
                    <a href="PedidosAdmin.html" class="btn-resumen-accion">Revisar Solicitudes →</a>
                </div>
            </div>

            <h2 class="titulo-seccion">Prendas Por agotarse/agotadas:</h2>
            
            <div class="inventario-container">
                <article class="card-inventario">
                    <div class="img-placeholder">
                        <img src="https://via.placeholder.com/200x230?text=Prenda" alt="Prenda">
                    </div>
                    
                    <div class="info-prenda">
                        <p>Preanda B</p>
                        <p>Precio: 80.000</p>
                        <p>Stock : 2</p>
                    </div>

                    <div class="acciones-prenda">
                        <button class="btn-blanco">Modificar Detalles</button>
                        <button class="btn-blanco">Ver Catalogo</button>
                    </div>
                </article>

                </div>
        </main>
    </div>

    <script src="../js/InicioAdmin.js" type="module"></script>
</body>
</html>
