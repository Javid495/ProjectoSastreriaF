<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/Pedidos.css">
</head>
<body>
    <!-- Header principal -->
    <header class="header">

    </header>


    <!-- main del contenido principal -->
    <main class="cuerpo__pedidos">


        <div class="cuerpo__encabezado">
            <h1 class="cuerpo__tiulo">Pedidos Realizados</h1>
    
            <div class="filtrados__filter">
      
                  <!-- Etiqueta del filtro -->
                  <label for="size" class="filter__label">Talla:</label>
      
                  <!-- Selector de talla -->
                  <select id="size" class="filter__select">
                      <option value="">Seleccionar</option>
                      <option value="pendientes">Pendientes</option>
                      <option value="elaboracion">Elaboracion</option>
                      <option value="por entregar">Por Entregar</option>
                      <option value="entregados">Entregados</option>
                  </select>
            </div>
        </div>

        <div class="contenedor__pedidos" id="contenedorPedidos">
            

        </div>

        <div class="btn-RealizarPedido">        
            <button class="cart__button">
                <span class="cart__text" >Realizar Pedido</span>
                <img src="../images/Pedidos/Vector (1).png" alt="Añadir" class="cart__icon" >
            </button>
        </div>

        <div id="MostraPedido">
            
        </div>

    </main>

    <!-- Footer principal de la pagina -->
    <footer class="footer">
    </footer>

    <script src="../js/Pedido.js" type="module"></script>
</body>
</html>
