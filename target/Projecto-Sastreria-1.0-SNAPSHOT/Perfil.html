<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/Perfil.css">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <title>Document</title>
</head>
<body>
    
    <!-- Header principal -->
        <header class="header">

        </header>

        <main class="contenedor__principal">
            <div class="contenedor__perfil">
                <article class="contenedor__usuario">
                    <img src="images/Perfil/Ellipse 14.png" alt="Prenda A" class="contenedor__image">
                    <h3 class="card__datouse card--username">Juan Caceres</h3>
                    <p class="card__datouse">Telefono: XX-XXXX-XXX</p>
                    <p class="card__datouse">Correo: juan@gmail.com</p>
                    <p class="card__datouse">Direccion: XX-XXXX-XXX</p>
                    <p class="card__datouse">Medidas: No disponible</p>
                    <button class="btn__config"><img src="images/Perfil/Vector.png" class="icon__perfil" alt=""></button>
                    <button class="btn__config btn__edit"><img src="images/Perfil/Vector (1).png" class="icon__perfil" alt=""></button>
                </article>
            </div>

            <div class="contenedor__historial">
                
                <h1 class="historial__titulo">Vistos Recientemente</h1>

                <div class="productos__historial">
                    <article class="card">
                        <img src="images/Rectangle 11.png" alt="Prenda A" class="card__image">
                        <h3 class="card__title">Prenda A</h3>
                        <p class="card__price">Precio: 40.000</p>
                        <button class="card__button">Ver detalles</button>
                    </article>
    
                    <article class="card">
                        <img src="images/Rectangle 26.png" alt="Prenda B" class="card__image">
                        <h3 class="card__title">Prenda B</h3>
                        <p class="card__price">Precio: 80.000</p>
                        <button class="card__button">Ver detalles</button>
                    </article>
                </div>
            </div>

        </main>

         <!-- Footer principal de la pagina -->
        <footer class="footer">
        </footer>

    <script src="js/LlamarComp/RelizarPeticion.js" type="module"></script>

</body>
</html>
